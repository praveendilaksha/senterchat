<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senter Music Festival 2026 | Senter AI</title>
  <meta name="description" content="Senter Music Festival 2026 official website preview with Senter AI Concierge." />
  <script src="/widget/senter-chat-widget.js" defer></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Scrollbar styling matching dark theme */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #000000;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ef4444;
    }

    .website-container {
      width: 100%;
      max-width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: #000000;
    }

    .website-screenshot {
      width: 100%;
      max-width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <div class="website-container">
    <img src="/website_ss.png" alt="Senter Music Festival 2026 Website" class="website-screenshot" />
  </div>

  <!-- Senter AI Chat Widget -->
  <senter-chat-widget api-endpoint="" position="bottom-right"></senter-chat-widget>
</body>
</html>
